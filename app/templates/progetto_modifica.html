{% extends "base.html" %}

{% block title %}Modifica progetto - PromeTeus{% endblock %}

{% block content %}
  <p class="breadcrumb"><a href="/progetti/{{ project.id }}">&larr; Torna al progetto</a></p>
  <h1>Modifica progetto</h1>

  <form class="form-card" method="post" action="/progetti/{{ project.id }}">
    {% include "_csrf.html" %}
    <label>Nome *
      <input type="text" name="name" required value="{{ project.name }}">
    </label>
    <label>Cliente
      <input type="text" name="client" value="{{ project.client or '' }}">
    </label>
    <div class="form-row">
      <label>La tua azienda
        <input type="text" name="company" value="{{ project.company or '' }}">
      </label>
      <label>Autore (chi esegue il test)
        <input type="text" name="author" value="{{ project.author or '' }}">
      </label>
    </div>
    <label>Scope / note
      <textarea name="scope" rows="2">{{ project.scope or '' }}</textarea>
    </label>
    <label>Info operative (VPN, credenziali... restano private, NON vanno nel report)
      <textarea name="info" rows="2">{{ project.info or '' }}</textarea>
    </label>
    <button type="submit">Salva modifiche</button>
  </form>
{% endblock %}
