{% extends "base.html" %}

{% block title %}{{ form_title }} - PromeTeus{% endblock %}

{% block content %}
  <p class="breadcrumb"><a href="{{ back_url }}">&larr; Indietro</a></p>
  <h1>{{ form_title }}</h1>

  <form class="form-card" method="post" action="{{ form_action }}">
    <label>Titolo del test *
      <input type="text" name="title" required value="{{ values.title }}" placeholder="Es. Login anonimo">
    </label>
    <label>Obiettivo
      <textarea name="goal" rows="2">{{ values.goal }}</textarea>
    </label>
    <label>Tool
      <input type="text" name="tool" value="{{ values.tool }}" placeholder="Es. nmap, wpscan">
    </label>
    <label>Comando / payload
      <textarea name="command" rows="3">{{ values.command }}</textarea>
    </label>
    <label>Come leggere il risultato
      <textarea name="interpretation" rows="2">{{ values.interpretation }}</textarea>
    </label>
    <label>Link / fonte
      <input type="text" name="references" value="{{ values.references }}" placeholder="https://...">
    </label>
    <button type="submit">{{ submit_label }}</button>
  </form>
{% endblock %}
